<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Product - Supply Chain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h3 class="card-title mb-4">Consumer Verification Portal</h3>
                        <p class="text-muted">Enter the Product ID to check its blockchain status.</p>
                        
                        <form method="POST" action="/verify">
                            <div class="mb-3">
                                <input type="number" class="form-control form-control-lg" name="pid" placeholder="Enter Product ID (e.g., 1024)" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">Verify on Blockchain</button>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
