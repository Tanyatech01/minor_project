<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>User Portal</title>
</head>
<body class="bg-light">
 
<div class="container mt-5">
    <h2 class="mb-4">Product Tracking (Block {{p}})</h2>
    <div class="table-responsive bg-white shadow-sm p-3">
        <table class="table table-hover">
            <thead class="table-primary">
                <tr>
                    <th>Product</th><th>Brand</th><th>Price</th><th>Status</th><th>Handler</th><th>Seller</th>
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr>
                    <td>{{row[0]}}</td>
                    <td>{{row[1]}}</td>
                    <td>{{row[2]}}</td>
                    <td>{{row[3]}}</td>
                    <td>{{row[4]}}</td>
                    <td>{{row[5]}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="mt-3">
        <a href="/?p={{p+1}}" class="btn btn-success">Load More</a>
        {% if p > 1 %}<a href="/?p={{p-1}}" class="btn btn-outline-dark">Back</a>{% endif %}
    </div>
</div>
<div class="container mt-2 text-end">
    <a href="/logout" class="btn btn-sm btn-danger">Logout</a>
</div>
</body>
</html>
