<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Create Account</title>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow-sm p-4" style="width: 350px;">
    <h3 class="text-center mb-4">User Sign Up</h3>
    
    {% if err %}
    <div class="alert alert-danger p-2 text-center">{{ err }}</div>
    {% endif %}

    <form method="POST" action="/signup">
        <div class="mb-3">
            <label class="form-label">Choose a Username</label>
            <input type="text" name="u" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Create a Password</label>
            <input type="password" name="p" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100 mb-2">Sign Up</button>
        <div class="text-center mt-2">
            <a href="/login" class="text-decoration-none">Already have an account? Login</a>
        </div>
    </form>
</div>
</body>
</html>
