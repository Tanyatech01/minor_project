<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blockchain Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="card shadow p-4">
                    
                    {% if msg %}
                        <h2 class="text-danger">❌ {{ msg }}</h2>
                    {% elif d %}
                        <h2 class="text-primary mb-4">Product Found on Ledger</h2>
                        
                        <table class="table table-bordered">
                            <thead class="table-secondary">
                                <tr>
                                    <th>Product ID</th>
                                    <th>Name</th>
                                    <th>Verification Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>{{ d.id }}</td>
                                    <td>{{ d.n }}</td>
                                    <td>
                                        {% if d.v == 'Verified' %}
                                            <b class="text-success">Verified (Authentic)</b>
                                        {% else %}
                                            <b class="text-danger">Non-Verified (Anomaly)</b>
                                        {% endif %}
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    {% endif %}
                    
                    <a href="/verify" class="btn btn-secondary mt-4">Back to Search</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
