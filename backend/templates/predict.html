<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>AI Verification Window</title>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h3 class="mb-4 text-center">AI Data Verification</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Brand Name</label>
                        <input type="text" name="brand" class="form-control" placeholder="e.g. Elite Collection" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <input type="text" name="cat" class="form-control" placeholder="e.g. Stickers" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Retail Price</label>
                        <input type="number" name="price" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Run AI Prediction</button>
                </form>

                {% if result %}
                <div class="mt-4 alert {% if result == 'Verified' %}alert-success{% else %}alert-danger{% endif %} text-center">
                    <h4>Status: {{ result }}</h4>
                </div>
                {% endif %}
                
                <div class="mt-3 text-center">
                    <a href="/" class="btn btn-link">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
