<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Admin Panel</title>
</head>
<body class="bg-light">
    <div class="mb-3">
    <a href="/add_product" class="btn btn-success">+ Add New Product Entry</a>
</div>
<div class="container mt-2 text-end">
    <a href="/logout" class="btn btn-sm btn-danger">Logout</a>
</div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Admin Ledger (Block {{p}})</h2>
        <div class="p-2 bg-dark text-success rounded border border-success">
            <strong>Block Hash:</strong> <small>{{ data[0][7] }}</small>
        </div>
    </div>
    
    <div class="table-responsive bg-white shadow-sm p-3">
        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Product</th><th>Brand</th><th>Price</th><th>Status</th><th>Handler</th><th>Seller</th><th>Consumer</th>
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr>
                    <td>{{row[0]}}</td><td>{{row[1]}}</td><td>{{row[2]}}</td><td>{{row[3]}}</td><td>{{row[4]}}</td><td>{{row[5]}}</td><td>{{row[6]}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="mt-3">
        <a href="/admin?p={{p+1}}" class="btn btn-primary">Next Block</a>
        {% if p > 1 %}<a href="/admin?p={{p-1}}" class="btn btn-secondary">Previous</a>{% endif %}
    </div>
</div>
</body>
</html>
