<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Secure AI Entry</title>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card mx-auto shadow border-0" style="max-width: 500px;">
        <div class="card-header bg-primary text-white text-center">
            <h5 class="mb-0">AI-Verified Product Entry</h5>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="n" class="form-control" placeholder="e.g. Wireless Mouse" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Brand</label>
                    <input type="text" name="b" class="form-control" placeholder="e.g. Dell" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" name="cat" class="form-control" placeholder="e.g. Electronics" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Retail Price</label>
                    <input type="number" name="pr" class="form-control" placeholder="0.00" required>
                </div>
                
                <div class="bg-light p-2 mb-3 rounded border text-center">
                    <small class="text-muted">Status will be auto-generated by AI Model</small>
                </div>

                <button type="submit" class="btn btn-primary w-100 shadow-sm">
                    Analyze & Add to Ledger
                </button>
            </form>
            <hr>
            <div class="text-center">
                <a href="/admin" class="btn btn-sm btn-outline-secondary">Cancel and Return</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
